name: Validate AI team configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static configuration checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository history for manifest comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Validate agents, skills, commands, templates, and security settings
        env:
          MANIFEST_BASE_REF: origin/${{ github.event.repository.default_branch || 'main' }}
        run: python scripts/validate_team.py
      - name: Check repository-relative Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check command references and agent frontmatter
        run: python scripts/check_cross_references.py
      - name: Check planning artifacts for unresolved placeholders
        run: python scripts/check_placeholders.py
      - name: Run offline inventory check (not Claude Code runtime discovery)
        run: python scripts/smoke_discovery.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify telemetry hash chain when a log is present
        run: |
          if [ -f .claude/telemetry/activity.jsonl ]; then
            python scripts/verify_telemetry.py
          else
            echo "Telemetry log absent; skipping hash-chain verification."
          fi
