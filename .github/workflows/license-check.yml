name: Dependency license check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: Audit declared Python dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install requirements when declared
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt
      - name: Install project dependencies when declared in pyproject.toml
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install .
      - name: Check and list dependency licenses
        run: python scripts/check_licenses.py
