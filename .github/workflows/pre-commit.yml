name: Pre-commit hooks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Formatting, lint and hygiene (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      # gitleaks has its own CI job; no-commit-to-branch only guards local commits.
      # The team scripts and tests run in "Validate AI team configuration".
      - name: Run all hooks on all files
        env:
          SKIP: no-commit-to-branch,gitleaks,validate-team,check-cross-references,check-markdown-links,check-placeholders,smoke-discovery
        run: pre-commit run --all-files --show-diff-on-failure
