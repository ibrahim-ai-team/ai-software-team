# Lint rules for scripts/ and tests/ (used by the ruff pre-commit hook).
target-version = "py310"
line-length = 130

[lint]
# Errors, pyflakes, bugbear, shebangs, import order, pyupgrade and simplifications.
select = ["E4", "E7", "E9", "F", "B", "EXE", "I", "UP", "SIM"]

[format]
quote-style = "double"
